{c:"Everyday Qatar",t:"How many mobile phones are in use in Qatar?",u:"phones",m:4.2e6,lo:3e6,hi:7e6,s:["About 3 million residents","× roughly 1.4 phones each, counting work phones and second SIMs","≈ 4.2 million phones"],f:"Plenty of people carry two, and at least one of them has a cracked screen.",ar:{t:"كم هاتفاً مستخدَماً في قطر؟",u:"هاتف",s:["نحو 3 ملايين نسمة","× نحو 1.4 هاتف لكل شخص، مع هواتف العمل والشرائح الإضافية","≈ 4.2 مليون هاتف"],f:"كثيرون يحملون هاتفين، وأحدهما على الأقل شاشته مكسورة."}},
{c:"Everyday Qatar",t:"How many light bulbs are switched on across Qatar at 9 pm?",u:"bulbs",m:2e7,lo:8e6,hi:5e7,s:["About 750,000 homes × roughly 15 lights each ≈ 11 million","+ offices, malls, streets and stadiums ≈ 9 million","Total ≈ 20 million bulbs"],f:"Doha after dark is basically a very efficient lightshow.",ar:{t:"كم لمبة مضيّئة في قطر الساعة 9 مساءً؟",u:"لمبة",s:["حوالي 750,000 بيت × تقريباً 15 لمبة لكل بيت ≈ 11 مليون","+ المكاتب والمولات والشوارع والملاعب ≈ 9 ملايين","المجموع ≈ 20 مليون لمبة"],f:"الدوحة ليلاً أشبه بعرض إضاءة بالغ الكفاءة."}},
{c:"Everyday Qatar",t:"How many WhatsApp voice notes are sent in Qatar every day?",u:"voice notes",m:3.7e7,lo:1e7,hi:1.5e8,s:["About 3 million residents","× roughly 85% use WhatsApp ≈ 2.5 million people","× about 15 voice notes each ≈ 37 million"],f:"Most of them are three minutes long and could have been a text.",ar:{t:"كم رسالة واتساب صوتية تُرسَل في قطر كل يوم؟",u:"رسالة صوتية",s:["حوالي 3 ملايين نسمة","× تقريباً 85% يستخدمون واتساب ≈ 2.5 مليون شخص","× حوالي 15 رسالة صوتية لكل واحد ≈ 37 مليون"],f:"أغلبها بثلاث دقائق، وكان يكفي أن تكون رسالة نصية."}},
{c:"Food & drink",t:"How many loaves and flatbreads does Qatar eat every day?",u:"pieces of bread",m:4e6,lo:1.5e6,hi:8e6,s:["About 3 million residents","× roughly 1.3 pieces of bread each a day, from samoon to Arabic bread to toast","≈ 4 million pieces"],f:"Bread is quietly the most dependable food in the country."},
{c:"Food & drink",t:"How many bottles of water does Qatar drink every day?",u:"bottles",m:6e6,lo:2.5e6,hi:1.2e7,s:["About 3 million residents","× roughly 2 bottles each a day, counting small ones, big ones and the office cooler","≈ 6 million bottles"],f:"It’s hot enough that nobody has ever been caught without one."},
{c:"Food & drink",t:"How many pizzas does Qatar order on a typical Friday?",u:"pizzas",m:2e5,lo:6e4,hi:6e5,s:["About 3 million residents","× roughly 1 in 5 orders pizza on a Friday ≈ 600,000 people","÷ about 3 people sharing each pizza ≈ 200,000 pizzas"],f:"Friday night is basically a national pizza holiday."},
{c:"Food & drink",t:"How many kilograms of rice does Qatar eat every day?",u:"kg",m:5e5,lo:2.5e5,hi:1e6,s:["Qatar imports roughly 200,000 tonnes of rice a year","÷ 365 ≈ 550 tonnes a day","≈ 500,000 kg eaten daily"],f:"Biryani, machboos, kabsa. Rice rarely misses a meal.",ar:{t:"كم كيلوغراماً من الأرز تأكل قطر كل يوم؟",u:"كجم",s:["تستورد قطر نحو 200,000 طن من الأرز سنوياً","÷ 365 ≈ 550 طناً يومياً","≈ 500,000 كجم تُؤكَل يومياً"],f:"برياني، مجبوس، كبسة. نادراً ما يغيب الأرز عن وجبة."}},
{c:"Money",t:"How many riyals does Qatar spend on coffee every day?",u:"QAR",m:1.8e7,lo:6e6,hi:5e7,s:["About 3 million residents","× roughly 1 in 3 buys a coffee on a typical day ≈ 1 million cups","× about QAR 18 a cup ≈ QAR 18 million"],f:"A lot of it is the extra shot nobody needed."},
{c:"Money",t:"How many riyals of cash are sitting in people’s wallets across Qatar right now?",u:"QAR",m:5e8,lo:1.5e8,hi:1.5e9,s:["About 3 million residents","× roughly 70% carry some cash ≈ 2.1 million wallets","× about QAR 250 each ≈ QAR 525 million"],f:"Digital payments are winning, but the QAR 5 note in the car door lives on.",ar:{t:"كم ريالاً نقدياً يوجد في محافظ الناس في قطر الآن؟",u:"ريال",s:["نحو 3 ملايين نسمة","× نحو 70% يحملون بعض النقود ≈ 2.1 مليون محفظة","× نحو 250 ريالاً لكل واحدة ≈ 525 مليون ريال"],f:"الدفع الإلكتروني ينتصر، لكن فئة الـ5 ريالات في باب السيارة ما زالت حيّة."}},
{c:"Roads",t:"How many litres of petrol and diesel do Qatar’s cars burn every day?",u:"litres",m:8e6,lo:3e6,hi:2e7,s:["About 1.8 million cars","× roughly 35 km a day = 63 million km","÷ about 8 km per litre ≈ 8 million litres"],f:"Big engines, long roundabouts and the AC on full."},
{c:"Roads",t:"How many people ride the Doha Metro on a typical weekday?",u:"riders",m:2e5,lo:8e4,hi:5e5,s:["About 3 million residents","× roughly 1 in 15 uses the metro on a weekday ≈ 200,000 riders"],f:"During the Arab Cup in December 2025, the metro and tram together averaged about 270,000 riders a day."},
{c:"Roads",t:"How many cars are washed in Qatar every day?",u:"cars",m:2.5e5,lo:8e4,hi:6e5,s:["About 1.8 million cars","÷ roughly 7, since most get washed about once a week ≈ 250,000 cars a day"],f:"The sand is back on the bonnet by lunchtime anyway."},
{c:"Travel",t:"How many flights take off or land at Hamad Airport every day?",u:"flights",m:880,lo:450,hi:1700,s:["About 54 million passengers a year (Hamad handled 54.3 million in 2025) ÷ 365 ≈ 149,000 a day","÷ roughly 170 passengers per flight ≈ 880 flights, counting arrivals and departures"],f:"That’s a plane roughly every minute and a half, all day and all night."},
{c:"Geography",t:"How many hours would it take to drive the whole Qatar coastline at 80 km/h?",u:"hours",m:7,lo:4,hi:14,s:["Qatar’s coastline is roughly 560 km","÷ 80 km/h ≈ 7 hours"],f:"In reality the road doesn’t follow the coast, so you’d need a boat for some of it.",ar:{t:"كم ساعة يستغرق قطع ساحل قطر كاملاً بسرعة 80 كم/س؟",u:"ساعة",s:["ساحل قطر نحو 560 كم","÷ 80 كم/س ≈ 7 ساعات"],f:"في الواقع لا يتبع الطريق الساحل، لذا ستحتاج إلى قارب لجزء منه."}},
{c:"Geography",t:"If everyone in the world stood in Qatar with one square metre each, how many people would fit?",u:"people",m:1.16e10,lo:5e9,hi:2e10,s:["Qatar covers about 11,600 km²","= 11.6 billion m²","÷ 1 m² per person ≈ 11.6 billion people"],f:"More than the entire planet, standing very, very close."},
{c:"Resources",t:"How many Olympic swimming pools would Qatar’s daily water use fill?",u:"pools",m:540,lo:280,hi:1100,s:["About 3 million residents × roughly 450 litres per person per day ≈ 1.35 billion litres","÷ one Olympic pool at about 2.5 million litres","≈ 540 pools"],f:"A new pool’s worth of water roughly every three minutes."},
{c:"Resources",t:"How many kilowatt-hours of electricity does Qatar use every day?",u:"kWh",m:1.5e8,lo:8e7,hi:3e8,s:["Qatar generates roughly 56 TWh of electricity a year","÷ 365 ≈ 154 million kWh a day"],f:"Air conditioning is the quiet giant behind most of it."},

{c:"Resources",t:"How many tonnes of rubbish does Qatar produce every day?",u:"tonnes",m:5e3,lo:2.5e3,hi:1.2e4,s:["About 3 million residents","× roughly 1.7 kg of waste per person per day ≈ 5,000 tonnes"],f:"Roughly the weight of 800 elephants, every single day."},
{c:"Sport",t:"How many kilometres do people run and walk along the Corniche on a cool Friday morning, combined?",u:"km",m:7500,lo:2e3,hi:3e4,s:["Roughly 1,500 runners and walkers on a cool morning","× about 5 km each ≈ 7,500 km"],f:"More than the distance from Doha to Beijing, before breakfast."},

{c:"Doha life",t:"How many times does the average person say “habibi” or “habibti” in a day?",u:"times",m:12,lo:4,hi:40,s:["Roughly 36 chats, calls and messages a day","× about 1 in 3 includes a habibi, habibti or ya habibi ≈ 12 times"],f:"Both a greeting and an apology, and occasionally a warning."},

{c:"Doha life",t:"How many people are on the Corniche on the first properly cool evening of the year?",u:"people",m:4.2e4,lo:1.5e4,hi:1.2e5,s:["The Corniche is about 7 km long","× roughly 6,000 people per km when the weather finally breaks ≈ 42,000 people"],f:"Winter in Doha lasts about six weeks, and everyone is out for every minute of it."},
{c:"Doha life",t:"How many “where are you?” messages are sent in Qatar every day?",u:"messages",m:1e6,lo:3e5,hi:4e6,s:["About 3 million residents","× roughly 1 in 3 sends one on a typical day ≈ 1 million messages"],f:"The reply is always “almost there.”"},
{c:"Doha life",t:"How many horn honks are there on Doha’s roads on a normal weekday?",u:"honks",m:2.4e6,lo:6e5,hi:8e6,s:["About 1.8 million cars","× roughly 1 in 3 honks at least once ≈ 600,000 cars","× about 4 honks each ≈ 2.4 million"],f:"Most of them land a tenth of a second after the light turns green."},
{c:"Doha life",t:"How many Instagram stories of the West Bay skyline are posted every sunset?",u:"stories",m:2e4,lo:6e3,hi:8e4,s:["About 3 million residents","× roughly 1 in 150 posts one on a given evening ≈ 20,000 stories"],f:"The skyline has no bad angles, apparently."},

{c:"Money",t:"How many riyals does Qatar spend on fuel at the pump every day?",u:"QAR",m:1.2e7,lo:5e6,hi:3e7,s:["About 8 million litres of fuel a day","× roughly QAR 1.5 per litre ≈ QAR 12 million"],f:"Cheap fuel is one quiet reason the engines stay big."},

{c:"Roads",t:"How many Toyota Land Cruisers are on Qatar's roads?",u:"Land Cruisers",m:2.5e5,lo:1e5,hi:6e5,s:["About 1.8 million cars","× roughly 1 in 7 is a Land Cruiser ≈ 250,000"],f:"Less a car, more the unofficial national vehicle."},

{c:"Everyday Qatar",t:"How many small cups of Arabic coffee are poured at majlis gatherings on a Friday?",u:"cups",m:1.5e6,lo:5e5,hi:4e6,s:["Roughly 300,000 gatherings and visits on a Friday","× about 5 small cups poured each ≈ 1.5 million"],f:"The cup is small on purpose, so the refills never stop."},

{c:"Food & drink",t:"How many kilograms of lamb and mutton does Qatar eat every day?",u:"kg",m:1.8e5,lo:6e4,hi:5e5,s:["About 3 million residents","× roughly 60 g of lamb each a day, heavier on weekends ≈ 180,000 kg"],f:"Fridays and feasts do most of the lifting."},

{c:"Food & drink",t:"How many kilograms of hummus does Qatar eat every day?",u:"kg",m:1.2e5,lo:4e4,hi:4e5,s:["About 3 million residents","× roughly 40 g of hummus each a day ≈ 120,000 kg"],f:"The debate over whole chickpeas on top will never be settled."},

{t:"كم ساعة يستغرق قطع ساحل قطر كاملاً بسرعة 80 كم/س؟",u:"ساعة",s:["ساحل قطر نحو 560 كم","÷ 80 كم/س ≈ 7 ساعات"],f:"في الواقع لا يتبع الطريق الساحل، لذا ستحتاج إلى قارب لجزء منه."},
{t:"لو وقف كل سكان العالم في قطر، لكل شخص متر مربع، كم شخصاً يتّسع؟",u:"شخص",s:["مساحة قطر نحو 11,600 كم²","= 11.6 مليار م²","÷ 1 م² لكل شخص ≈ 11.6 مليار شخص"],f:"أكثر من سكان الكوكب كله، واقفين متلاصقين جداً جداً."},
{t:"كم مسبحاً أولمبياً يملأ استهلاك قطر اليومي من الماء؟",u:"مسبح",s:["نحو 3 ملايين نسمة × نحو 450 لتراً للفرد يومياً ≈ 1.35 مليار لتر","÷ مسبح أولمبي سعته نحو 2.5 مليون لتر","≈ 540 مسبحاً"],f:"ما يعادل مسبحاً جديداً من الماء كل ثلاث دقائق تقريباً."},
{t:"كم كيلوواط-ساعة من الكهرباء تستهلك قطر كل يوم؟",u:"ك.و.س",s:["تولّد قطر نحو 56 تيراواط-ساعة من الكهرباء سنوياً","÷ 365 ≈ 154 مليون ك.و.س يومياً"],f:"التكييف هو العملاق الهادئ وراء معظمها."},
{t:"كم كيساً بلاستيكياً تستهلك قطر في اليوم؟",u:"كيس",s:["نحو 3 ملايين نسمة","× نحو كيس واحد لكل شخص يومياً، من البقالة والمطاعم والمحلات ≈ 3 ملايين كيس"],f:"الأكياس أحادية الاستخدام تتراجع، لكن عادة الكيس داخل كيس يصعب كسرها."},
{t:"كم طناً من القمامة تنتج قطر كل يوم؟",u:"طن",s:["نحو 3 ملايين نسمة","× نحو 1.7 كجم نفايات للفرد يومياً ≈ 5,000 طن"],f:"يعادل تقريباً وزن 800 فيل، كل يوم."},
{t:"كم كيلومتراً يركض الناس ويمشون على الكورنيش في صباح جمعة بارد، مجتمعين؟",u:"كم",s:["نحو 1,500 عدّاء وماشٍ في صباح بارد","× نحو 5 كم لكل واحد ≈ 7,500 كم"],f:"أبعد من المسافة بين الدوحة وبكين، قبل الفطور."},
{t:"كم اشتراك نادٍ رياضي نشط في قطر؟",u:"اشتراك",s:["نحو 3 ملايين نسمة","× نحو 1 من 8 لديه اشتراك نادٍ ≈ 375,000"],f:"أمّا هل يستخدمونها فهذا سؤال آخر تماماً."},
{t:"كم مرة في الأسبوع يُقطَع الطريق على سائق في الدوحة عند الدوار؟",u:"مرة",s:["نحو 20 دواراً في الأسبوع ضمن رحلة يومية عادية","× نحو 2 من 5 منها فيها من لم يرَك أو رآك ولم يكترث","≈ 8 مرات"],f:"تُعامَل إشارات الانعطاف كإضافة اختيارية."},
{t:"كم مرة يقول الشخص العادي «حبيبي» أو «حبيبتي» في اليوم؟",u:"مرة",s:["نحو 36 محادثة ومكالمة ورسالة يومياً","× نحو 1 من 3 تتضمن حبيبي أو حبيبتي أو يا حبيبي ≈ 12 مرة"],f:"تحية واعتذار، وأحياناً تحذير."},
{t:"يقول صديق إنه «على بُعد دقيقتين». كم دقيقة يستغرق فعلاً؟",u:"دقيقة",s:["الموعود: دقيقتان","× معامل تحويل الدوحة الذي يقارب 10، بسبب الزحمة والمواقف ومشوار إضافي","≈ 20 دقيقة"],f:"أول عشر منها يقضيها «وصلت تقريباً» وهو ما زال يتجهّز."},
{t:"كم شخصاً يخرج إلى البر في ليلة خميس شتوية؟",u:"شخص",s:["نحو 3 ملايين نسمة","× نحو 1 من 20 يخيّم أو يطعّس أو يجلس حول نار ≈ 150,000 شخص"],f:"مع دلّة ممتلئة، وسمّاعة، وكمية مقلقة من الرمل في السيارة."},
{t:"كم قطة ضالة تعيش في الدوحة؟",u:"قطة",s:["نحو 2.5 مليون شخص يعيشون في الدوحة وما حولها","÷ نحو 40 شخصاً لكل قطة ≈ 60,000 قطة"],f:"كل محطة بنزين لها عُمدة، والعُمدة قطة."},
{t:"كم شخصاً على الكورنيش في أول مساء بارد فعلاً في السنة؟",u:"شخص",s:["طول الكورنيش نحو 7 كم","× نحو 6,000 شخص لكل كم حين يعتدل الجو أخيراً ≈ 42,000 شخص"],f:"الشتاء في الدوحة نحو ستة أسابيع، والجميع في الخارج كل دقيقة منه."},
{t:"كم رسالة «وينك؟» تُرسَل في قطر كل يوم؟",u:"رسالة",s:["نحو 3 ملايين نسمة","× نحو 1 من 3 يرسل واحدة في يوم عادي ≈ مليون رسالة"],f:"الرد دائماً «وصلت تقريباً»."},
{t:"كم بوق سيارة يُسمَع على طرقات الدوحة في يوم عمل عادي؟",u:"بوق",s:["نحو 1.8 مليون سيارة","× نحو 1 من 3 يبوّق مرة على الأقل ≈ 600,000 سيارة","× نحو 4 أبواق لكل واحدة ≈ 2.4 مليون"],f:"أغلبها يأتي بعد عُشر ثانية من اخضرار الإشارة."},
{t:"كم ستوري إنستغرام لأفق الخليج الغربي يُنشَر كل غروب؟",u:"ستوري",s:["نحو 3 ملايين نسمة","× نحو 1 من 150 ينشر واحداً في مساء معيّن ≈ 20,000 ستوري"],f:"يبدو أن الأفق ليس له زاوية سيئة."},
{t:"كم سائق توصيل على طرقات الدوحة الساعة 9 مساء الجمعة؟",u:"سائق",s:["افترض نحو 300,000 طلب يومياً، نحو 20% منها في الساعات الثلاث حول عشاء الجمعة ≈ 60,000 طلب","÷ 3 ساعات ≈ 20,000 طلب في الساعة","÷ نحو طلبين لكل سائق في الساعة ≈ 10,000 سائق"],f:"يعرفون كل طريق مختصر وكل طريق خدمة في المدينة."},
{t:"كم كيلومتراً يمشي الناس داخل المولات المكيّفة في يوم صيفي حرارته 45°م؟",u:"كم",s:["نحو 3 ملايين نسمة","× نحو 1 من 10 يذهب إلى مول ≈ 300,000 شخص","× نحو 1.5 كم مشياً لكل واحد ≈ 450,000 كم"],f:"أبعد من المسافة إلى القمر، فقط هرباً من الحر."},
{t:"كم مرة في اليوم يتصل سائق توصيل ليسأل «وين بيتك بالضبط؟»",u:"مكالمة",s:["افترض نحو 300,000 طلب يومياً","× نحو 2 من 3 تنتهي بمكالمة «وين أنت بالضبط؟» ≈ 200,000 مكالمة"],f:"الجواب دائماً «جنب العمارة الثانية»."},
{t:"كم كوب كرك يُباع في قطر كل يوم؟",u:"كوب",s:["نحو 3 ملايين نسمة","× نحو كوب كرك لكل شخص في يوم عادي، وكثيرون يشربون كوبين ≈ 3 ملايين كوب"],f:"يقفز الرقم لحظة ينزل الجو تحت 25°م."},
{t:"كم شاورما تلفّ قطر في يوم عطلة نهاية أسبوع عادي؟",u:"شاورما",s:["نحو 3 ملايين نسمة","× نحو 1 من 8 يأكل شاورما في يوم عطلة ≈ 375,000","تقريباً 400,000 لفة"],f:"نسبة صوص الثوم إلى اللحم تبقى نقاشاً وطنياً."},
{t:"كم تمرة تأكل قطر في يوم واحد من رمضان؟",u:"تمرة",s:["نحو 3 ملايين نسمة","× نحو 3 تمرات لكل شخص لكسر الصيام ≈ 9 ملايين تمرة"],f:"الأعداد الفردية سنّة، ولهذا الثلاث هي البداية الكلاسيكية."},
{t:"كم مكيّفاً يعمل في قطر في ظهيرة صيفية؟",u:"مكيّف",s:["نحو 750,000 بيت × نحو 3 مكيّفات لكل بيت ≈ 2.2 مليون","+ المكاتب والمحلات والمساجد والمولات ≈ 0.8 مليون","المجموع ≈ 3 ملايين مكيّف"],f:"في يوليو، إطفاؤها كلها دفعة واحدة خطة لن يفكّر فيها أحد."},
{t:"كم شريحة اتصال نشطة في قطر؟",u:"شريحة",s:["نحو 3 ملايين نسمة","× نحو 1.7 شريحة لكل شخص، مع خطوط العمل وشرائح البيانات والاحتياطية ≈ 5 ملايين"],f:"الشريحة الاحتياطية في الدرج تُحسَب أيضاً، تقنياً."},
{t:"كم شاشة تُشغَّل في قطر خلال مباراة كبيرة للمنتخب؟",u:"شاشة",s:["نحو 750,000 بيت × نحو شاشة واحدة لكل بيت متابِع ≈ 750,000","+ شاشات المقاهي والمجالس ≈ 800,000"],f:"نصفها صامت بينما تتولّى مجموعة الدردشة التعليق."},
{t:"كم ريالاً تنفق قطر على الوقود في المحطات كل يوم؟",u:"ريال",s:["نحو 8 ملايين لتر وقود يومياً","× نحو 1.5 ريال لكل لتر ≈ 12 مليون ريال"],f:"الوقود الرخيص سبب هادئ لبقاء المحركات كبيرة."},
{t:"كم ريالاً من الذهب يُشترى في قطر في اليوم؟",u:"ريال",s:["نحو 2,000 عملية شراء ذهب يومياً في الأسواق والمولات","× نحو 3,000 ريال لكل واحدة ≈ 6 ملايين ريال"],f:"واجهات سوق الذهب أشبه بحساب توفير وطني."},
{t:"كم سيارة تويوتا لاند كروزر على طرقات قطر؟",u:"لاند كروزر",s:["نحو 1.8 مليون سيارة","× نحو 1 من 7 منها لاند كروزر ≈ 250,000"],f:"ليست سيارة بقدر ما هي المركبة الوطنية غير الرسمية."},
{t:"كم إشارة مرور في الدوحة؟",u:"إشارة",s:["في الدوحة نحو 300 تقاطع مُشار","× نحو 3 رؤوس إشارة لكل تقاطع ≈ 900"],f:"عدد منها يصير أخضر في اللحظة التي تمدّ فيها يدك إلى هاتفك."},
{t:"كم موقف سيارة في مول كبير بالدوحة؟",u:"موقف",s:["المول الكبير يرصّ عدة طوابق مواقف","نحو 6 طوابق × نحو 1,000 موقف لكل طابق ≈ 6,000"],f:"ومع ذلك يبدو مساء الجمعة وكأن لا موقف متبقٍّ."},
{t:"كم حقيبة تمرّ عبر مطار حمد الدولي كل يوم؟",u:"حقيبة",s:["نحو 149,000 مسافر يومياً","× نحو حقيبة مسجّلة واحدة لكل شخص ≈ 150,000 حقيبة"],f:"بعضها، في أي لحظة، على السير الدوّار الخطأ."},
{t:"كم سيارة أجرة وتطبيق توصيل تعمل في الدوحة الآن؟",u:"سيارة",s:["نحو 3 ملايين نسمة","× نحو سيارة أجرة أو توصيل واحدة نشطة لكل 100 شخص ≈ 30,000"],f:"تسعير الذروة لديه حاسّة سادسة للحظة بدء المطر."},
{t:"كم كيلومتراً من المسار تقطع لو ركبت خطوط مترو الدوحة الثلاثة من طرف لطرف؟",u:"كم",s:["الخطوط الأحمر والأخضر والذهبي نحو 76 كم من المسار إجمالاً"],f:"أبعد من القيادة من الدوحة إلى الحدود السعودية."},
{t:"كم ملعب كرة قدم يتّسع داخل مطار حمد الدولي؟",u:"ملعب",s:["مساحة المطار نحو 29 كم²","= 29 مليون م²","÷ نحو 7,000 م² لكل ملعب ≈ 4,000 ملعب"],f:"من المطارات القليلة التي تميّزها بوضوح من الفضاء."},
{t:"كم لتراً من الماء يستهلك بيت واحد في الدوحة في اليوم؟",u:"لتر",s:["نحو 4 أشخاص لكل بيت","× نحو 450 لتراً لكل شخص يومياً ≈ 1,800 لتر"],f:"من الأعلى في أي مكان، وخرطوم الحديقة جزء كبير منه."},
{t:"كم خطوة يمشي موظف المكتب العادي في الدوحة يومياً؟",u:"خطوة",s:["من السيارة إلى المصعد إلى المكتب إلى المصعد إلى السيارة","نحو 5,000 خطوة مع جولات القهوة ولفّة مسائية في المول"],f:"هدف الـ10,000 يتحقّق غالباً داخل المولات المكيّفة."},
{t:"كم ملعب بادل في قطر؟",u:"ملعب",s:["انتشر البادل مع عشرات المواقع","نحو 80 موقعاً × نحو 6 ملاعب لكل موقع ≈ 500 ملعب"],f:"أسرع طريقة لشدّ عضلة في البلد."},
{t:"كم فنجان قهوة عربية يُصبّ في المجالس يوم الجمعة؟",u:"فنجان",s:["نحو 300,000 تجمّع وزيارة يوم الجمعة","× نحو 5 فناجين صغيرة تُصبّ في كل واحد ≈ 1.5 مليون"],f:"الفنجان صغير عمداً، كي لا تتوقف التعبئة."},
{t:"كم كيلوغراماً من الدجاج تطبخ قطر كل يوم؟",u:"كجم",s:["نحو 3 ملايين نسمة","× نحو 200 غرام دجاج لكل شخص يومياً، في البرياني والمشاوي والشاورما ≈ 600,000 كجم"],f:"الدجاج بهدوء يتفوّق على كل أنواع اللحم في البلد."},
{t:"كم مرة في الأسبوع يقول أحدهم في الدوحة «إن شاء الله» وهو يقصد «غالباً لا»؟",u:"مرة",s:["نحو 40 خطة والتزاماً في الأسبوع","× نحو 1 من 5 لن يحدث بهدوء ≈ 8 إلى 9 مرات"],f:"كلمة جميلة تصلح أيضاً كأرقّ رفض ممكن."},
{t:"كم سيلفي يُلتقط في اللؤلؤة في عطلة نهاية أسبوع لطيفة؟",u:"سيلفي",s:["نحو 40,000 زائر عبر العطلة","× نحو صورتين لكل واحد والمارينا خلفه ≈ 80,000"],f:"اليخوت ديكور وهي تعرف ذلك."},
{t:"كم مرة في الأسبوع يُضيَّأ على سائق في الدوحة من الخلف ليفسح الطريق؟",u:"مرة",s:["نحو 10 رحلات سريعة على الطريق أسبوعياً","× أكثر بقليل من إضاءة متعجّلة واحدة لكل رحلة ≈ 12 مرة"],f:"المسار السريع يُعامَل كمدرج خاص."},
{t:"كم صورة يلتقطها السياح للجمال في سوق واقف في اليوم؟",u:"صورة",s:["نحو 5,000 زائر قرب الإسطبلات يومياً","× نحو 3 صور لكل واحد للجمال والخيل ≈ 15,000"],f:"الجمال أتقنت وضعية اللامبالاة."},
{t:"كم لفة يدور السائق في موقف مول مزدحم قبل أن يجد مكاناً؟",u:"لفة",s:["في جمعة مزدحمة تكون الصفوف الواضحة ممتلئة","فتستغرق نحو 3 لفّات، مع من يتبعك إلى موقفك القديم"],f:"المكان المثالي يفرغ لحظة تستسلم وتركن بعيداً."},
{t:"كم علبة وزجاجة مشروب غازي تستهلك قطر في اليوم؟",u:"مشروب",s:["نحو 3 ملايين نسمة","× نحو مشروب غازي واحد لكل شخص يومياً ≈ 3 ملايين"],f:"الخالية من السكر تُشترى دائماً بأفضل النوايا."},
{t:"كم كيلوغراماً من لحم الضأن تأكل قطر كل يوم؟",u:"كجم",s:["نحو 3 ملايين نسمة","× نحو 60 غرام ضأن لكل شخص يومياً، أثقل في العطلات ≈ 180,000 كجم"],f:"الجُمع والمناسبات تتحمّل العبء الأكبر."},
{t:"كم طبق برياني ومجبوس تقدّم قطر في اليوم؟",u:"طبق",s:["نحو 3 ملايين نسمة","× نحو 1 من 3 يأكل طبق أرز في يوم معيّن ≈ مليون طبق"],f:"الطبقة المقرمشة في قاع القِدر غير قابلة للتفاوض."},
{t:"كم كوب عصير طازج تشرب قطر كل يوم؟",u:"كوب",s:["نحو 3 ملايين نسمة","× نحو 1 من 4 يأخذ عصيراً طازجاً ≈ 750,000 كوب"],f:"عصير الأفوكادو والعسل له جمهور وفيّ بهدوء."},
{t:"كم برغر تأكل قطر في يوم عطلة عادي؟",u:"برغر",s:["نحو 3 ملايين نسمة","× نحو 1 من 8 يأكل برغر في يوم عطلة ≈ 375,000"],f:"لكل واحد قطعته المفضّلة، وهي غير قابلة للتفاوض."},
{t:"كم قطعة سوشي تأكل قطر كل يوم؟",u:"قطعة",s:["نحو 30 مطعماً يابانياً، مع المقاهي وأركان السوبرماركت ≈ 120 منفذ سوشي","× نحو 400 قطعة يومياً لكل منفذ ≈ 50,000 قطعة"],f:"أقبلت الدوحة على السوشي بسرعة ولم تلتفت وراءها."},
{t:"كم كيلوغراماً من الحمّص تأكل قطر كل يوم؟",u:"كجم",s:["نحو 3 ملايين نسمة","× نحو 40 غرام حمّص لكل شخص يومياً ≈ 120,000 كجم"],f:"الجدل حول حبّات الحمّص فوق الطبق لن يُحسَم أبداً."},
{t:"كم سمبوسة تأكل قطر في يوم واحد من رمضان؟",u:"سمبوسة",s:["نحو 3 ملايين نسمة","× نحو سمبوستين لكل شخص على الإفطار ≈ 6 ملايين"],f:"التي تحرق سقف فمك هي دائماً الأولى."},
{t:"كم كرة آيس كريم تبيع قطر في يوم صيفي حار؟",u:"كرة",s:["نحو 3 ملايين نسمة","× نحو 1 من 8 يشتري آيس كريم في يوم لاهب ≈ 375,000 كرة"],f:"في أغسطس لا يكون متعة بقدر ما هو استراتيجية بقاء."},
{t:"كم عبوة لبن وزبادي شراب تشرب قطر كل يوم؟",u:"عبوة",s:["نحو 3 ملايين نسمة","× نحو 0.4 عبوة لبن لكل شخص يومياً ≈ 1.2 مليون"],f:"الرفيق الطبيعي لأي شيء حار."},
{t:"كم كيلوغراماً من المانجو تأكل قطر في اليوم خلال موسمها؟",u:"كجم",s:["نحو 3 ملايين نسمة","× نحو 170 غرام مانجو لكل شخص يومياً في الموسم ≈ 500,000 كجم"],f:"موسم الألفونسو يحوّل الهادئين إلى متنافسين."},
{t:"كم مسجداً في قطر؟",u:"مسجد",s:["نحو مسجد لكل 1,500 نسمة","× نحو 3 ملايين نسمة ≈ 2,000 مسجد"],f:"أنت لست بعيداً أبداً عن الأذان التالي."},
{t:"كم أذاناً يُرفَع في قطر في اليوم؟",u:"أذان",s:["نحو 2,000 مسجد","× 5 صلوات يومياً ≈ 10,000 أذان"],f:"خمس مرات يومياً، تضبط البلد كلها الساعة نفسها."},
{t:"كم مصعداً في قطر؟",u:"مصعد",s:["آلاف الأبراج والفنادق والمولات والفلل","نحو 40,000 مصعد إجمالاً"],f:"الخليج الغربي وحده يُشغِل عدداً كبيراً منها."},
{t:"كم كاميرا مراقبة في الدوحة؟",u:"كاميرا",s:["محلات وطرق وأبراج ومجمّعات","نحو كاميرا لكل 8 من سكان الدوحة ≈ 300,000"],f:"في مكان ما، ركنك المشبوه مسجَّل."},
{t:"كم صرّافاً آلياً في قطر؟",u:"صرّاف",s:["نحو 3 ملايين نسمة","× نحو صرّاف لكل 1,700 شخص ≈ 1,800"],f:"ما زال مفيداً للكاش الذي يعيش في باب السيارة."},
{t:"كم نخلة تمر في قطر؟",u:"نخلة",s:["مزارع وأرصفة وحدائق ومتنزّهات","نحو 3 ملايين نخلة"],f:"الشجرة الوطنية غير الرسمية، وتستحق اللقب كل صيف."},
{t:"كم غسالة تعمل في قطر صباح الجمعة؟",u:"غسالة",s:["نحو 750,000 بيت","× نحو 1 من 2 يشغّل غسلة يوم الجمعة ≈ 375,000"],f:"الثياب والعبايات لها جدولها الصارم الخاص."},
{t:"كم صيدلية في قطر؟",u:"صيدلية",s:["نحو 3 ملايين نسمة","× نحو صيدلية لكل 3,000 شخص ≈ 1,000"],f:"تفتح حتى وقت متأخر، ودائماً فيها باراسيتامول وفيتامين سي."},
{t:"كم صالون حلاقة وتجميل في قطر؟",u:"صالون",s:["نحو 3 ملايين نسمة","× نحو واحد لكل 1,000 شخص ≈ 3,000"],f:"زحمة ما قبل الأعراس والعيد حدث وطني."},
{t:"كم ريالاً ترسله قطر إلى الخارج كحوالات كل يوم؟",u:"ريال",s:["ترسل قطر عشرات المليارات من الريالات سنوياً","نحو 120 مليون ريال يومياً"],f:"يوم الراتب يحوّل محال الصرافة إلى أكثر الأماكن ازدحاماً."},
{t:"كم ريالاً تنفق قطر على العود والعطور كل يوم؟",u:"ريال",s:["نحو 100,000 عملية شراء يومياً","× نحو 80 ريالاً لكل واحدة ≈ 8 ملايين ريال"],f:"كثيراً ما تعرف أن أحدهم غادر الغرفة بعد عشر دقائق."},
{t:"كم ريالاً يجني سوق واقف خلال عطلة نهاية أسبوع؟",u:"ريال",s:["نحو 50,000 زائر عبر العطلة","× نحو 300 ريال لكل واحد على الطعام والهدايا والبهارات ≈ 15 مليون ريال"],f:"لا أحد يغادر دون شيء لم يخطّط لشرائه."},
{t:"كم ريالاً من مخالفات المواقف تصدرها قطر في اليوم؟",u:"ريال",s:["نحو 1,000 مخالفة يومياً","× نحو 300 ريال لكل واحدة ≈ 300,000 ريال"],f:"أضواء التحذير كان يُفترض أن تجعلها مقبولة. لم تفعل."},
{t:"كم ريالاً يكلّف عرس قطري كبير؟",u:"ريال",s:["قاعة وتموين لمئات وذهب وهدايا","نحو مليون ريال لعرس كبير"],f:"قائمة المدعوين لها طريقة هادئة في النموّ وحدها."},
{t:"كم ريالاً تنفق قطر على رسوم المدارس الخاصة في السنة؟",u:"ريال",s:["نحو 230,000 طالب في المدارس الخاصة","× نحو 40,000 ريال في السنة ≈ 9 مليار ريال"],f:"سبتمبر شهر ثقيل على كثير من العائلات."},
{t:"كم ريالاً من الفكّة موجود في سيارات قطر الآن؟",u:"ريال",s:["نحو 1.8 مليون سيارة","× نحو 5 ريالات من المعدن والأوراق الصغيرة لكل واحدة ≈ 9 ملايين ريال"],f:"أغلبها متّجه إلى عدّاد مواقف لم يعد موجوداً."},
{t:"كم دواراً في قطر؟",u:"دوار",s:["شبكة طرق بُنيت حولها","نحو 350، تتقلّص ببطء مع إحلال التقاطعات محلّها"],f:"لكل واحد قواعد غير مكتوبة يفسّرها الجميع بشكل مختلف."},
{t:"كم مطبّاً في الدوحة؟",u:"مطبّ",s:["مجمّعات ومدارس وشوارع جانبية في كل مكان","نحو 20,000 مطبّ"],f:"أصحاب السيارات الرياضية يشعرون بكل واحد منها."},
{t:"كم محطة بنزين في قطر؟",u:"محطة",s:["نحو 1.8 مليون سيارة تخدمها شبكة متنامية","نحو 120 محطة"],f:"ما زالت الطوابير تظهر لحظة يحتاج الجميع الوقود دفعة واحدة."},
{t:"كم كيلومتراً من الطرق في قطر؟",u:"كم",s:["طرق سريعة وشوارع مدن ومشاريع جديدة","نحو 10,000 كم من الطرق"],f:"نسبة مفاجئة منها بُنيت في آخر خمسة عشر عاماً."},
{t:"كم حافلة عامة تعمل في قطر؟",u:"حافلة",s:["شبكة عامة سريعة التوسّع","نحو 3,000 حافلة، كثير منها كهربائي"],f:"حافلات ربط المترو جاءت في وقت احتاجها الناس تماماً."},
{t:"كم سيارة تمرّ عبر تقاطع رئيسي في الدوحة في ساعة الذروة؟",u:"سيارة",s:["عدة مسارات في كل اتجاه عند الذروة","نحو 8,000 سيارة في الساعة عبر تقاطع كبير"],f:"خمس من تلك الدقائق تبدو أطول دقائق يومك."},
{t:"كم لوحة سيارة تُصدَر في قطر في يوم عادي؟",u:"لوحة",s:["نحو 150,000 مركبة جديدة سنوياً","÷ 365 ≈ 400 يومياً"],f:"الأرقام المنخفضة والمستديرة تُباع بمبالغ مذهلة في المزاد."},
{t:"كم سكوتر كهربائي في شوارع الدوحة في مساء بارد؟",u:"سكوتر",s:["سكوترات مشتركة وخاصة على الكورنيش ومشيرب","نحو 5,000 في مساء لطيف"],f:"الكورنيش يصير بهدوء حلبة سباقها غير الرسمية."},
{t:"كم مسافراً تنقل الخطوط الجوية القطرية في يوم عادي؟",u:"مسافر",s:["نحو 50 مليون مسافر سنوياً","÷ 365 ≈ 140,000 يومياً"],f:"نسبة جيدة منهم مجرد عابرين في رحلة ترانزيت."},
{t:"كم غرفة فندقية في قطر؟",u:"غرفة",s:["دفعة سياحية وإرث كأس العالم","نحو 40,000 غرفة فندقية"],f:"نسبة الإشغال تتأرجح بشدّة مع روزنامة الفعاليات."},
{t:"كم شخصاً يزور الحيّ الثقافي كتارا في عطلة نهاية أسبوع؟",u:"زائر",s:["شواطئ ومعارض ومطاعم وفعاليات","نحو 80,000 عبر العطلة"],f:"أبراج الحمام أكثر بيوت طيور فارغة تُصوَّر في قطر."},
{t:"كم مركباً شراعياً يرسو على كورنيش الدوحة؟",u:"مركب",s:["قوارب خشبية تقليدية للجولات والصور","نحو 60 على طول الكورنيش"],f:"نصفها رحلة سياحية ونصفها استوديو تصوير عائم."},
{t:"كم سائحاً يزور سوق واقف في يوم من موسم البرودة؟",u:"سائح",s:["السوق القديم أول محطة لأغلب الزوار","نحو 20,000 في يوم لطيف"],f:"سوق الصقور والجمال يتوليان أغلب الإقناع."},
{t:"كم كيلومتراً يطير أسطول الخطوط القطرية في يوم واحد؟",u:"كم",s:["نحو 250 طائرة","× نحو 12,000 كم يطيرها كلٌّ منها يومياً ≈ 3 ملايين كم"],f:"يعادل الدوران حول الكوكب عشرات المرات، كل يوم."},
{t:"كم جزيرة تقع قبالة ساحل قطر؟",u:"جزيرة",s:["جزر طبيعية وصناعية تنتشر على الساحل","نحو 80 إجمالاً"],f:"بعضها يظهر ويختفي مع المدّ والجرف."},
{t:"كم شخصاً فوق بعضهم يعادلون ارتفاع أطول برج في قطر؟",u:"شخص",s:["أطول برج نحو 300 م","÷ نحو 1.7 م لكل شخص ≈ 190 شخصاً"],f:"رجاءً لا تجرّب هذا في البيت."},
{t:"كم لتراً من ماء البحر تحلّي قطر في اليوم؟",u:"لتر",s:["تأتي كل مياه الشرب تقريباً من البحر","نحو 1.6 مليار لتر يومياً"],f:"الخليج بهدوء هو أكبر صنبور لقطر."},
{t:"كم ملعب كرة قدم يتّسع داخل المدينة التعليمية؟",u:"ملعب",s:["تغطّي المدينة التعليمية نحو 14 كم²","= 14 مليون م² ÷ نحو 7,000 م² لكل ملعب ≈ 2,000 ملعب"],f:"ويبقى مكان لعدة جامعات بينها."},
{t:"كم كيلومتراً تبعد الدوحة عن أقرب عاصمة أخرى، المنامة؟",u:"كم",s:["عبر الخليج إلى البحرين","نحو 150 كم بخط مستقيم"],f:"قريبة بما يكفي ليبقى الحديث عن جسر لا ينقطع."},
{t:"كم غيغابايت من بيانات الجوال تستهلك قطر في اليوم؟",u:"غيغابايت",s:["نحو 3 ملايين نسمة","× نحو 3.3 غيغابايت لكل شخص يومياً من الفيديو والمكالمات والتصفّح ≈ 10 مليون غيغابايت"],f:"شريحة كبيرة منها ريلز تُشاهَد عند الإشارات الحمراء."},
{t:"كم طناً من الرمل يهبّ على طرقات قطر في يوم مغبّر؟",u:"طن",s:["رياح الشمال ترفع الرمل عبر البلد كله","نحو 5,000 طن تستقرّ على الطرق في يوم مغبّر"],f:"السيارة التي غسلتها أمس نسيت ذلك بالفعل."},
{t:"كم كيلوواط-ساعة من الكهرباء يستهلك التكييف في قطر في اليوم؟",u:"ك.و.س",s:["التكييف أكثر من نصف استهلاك الطاقة في قطر","نحو 70 مليون ك.و.س يومياً في الصيف"],f:"حرب مؤشّر الحرارة أطول نزاع مستمرّ في أغلب المكاتب."},
{t:"كم لتراً من الماء يُبقي عشب قطر وملاعب الغولف حيّة في اليوم؟",u:"لتر",s:["متنزّهات وجزر وسطية وعشب وملاعب في صحراء","نحو 200 مليون لتر يومياً"],f:"كل شفرة خضراء هنا فعل تحدٍّ صغير."},
{t:"كم طناً من الطعام تهدر قطر في اليوم؟",u:"طن",s:["نحو 3 ملايين نسمة","× نحو 0.5 كجم مهدرة لكل شخص يومياً ≈ 1,500 طن"],f:"البوفيهات السخيّة والحصص الكبيرة تتحمّل أغلب اللوم."},
{t:"كم لوحاً شمسياً يلزم لتشغيل بيت قطري واحد ليوم؟",u:"لوح",s:["بيت يستهلك نحو 60 ك.و.س يومياً","÷ نحو 1.5 ك.و.س لكل لوح يومياً ≈ 40 لوحاً"],f:"الشمس، على الأقل، ليست المشكلة هنا أبداً."},
{t:"كم مسبحاً في قطر؟",u:"مسبح",s:["فلل ومجمّعات وفنادق ونوادٍ","نحو 20,000 مسبح"],f:"أربعة أشهر في السنة تكون أدفأ من حوض الاستحمام."},
{t:"كم شخصاً يملأ مدرّجات مباراة كبيرة في قطر؟",u:"شخص",s:["استاد كبير","نحو 40,000 مقعد ممتلئ لمباراة كبيرة"],f:"تكييف المدرّجات كان النجم الحقيقي."},
{t:"كم كيلومتراً يُركَض على أجهزة الجري في نوادي قطر في اليوم؟",u:"كم",s:["نحو 375,000 عضو نادٍ","× نحو 1 من 8 يركض 3 كم في يوم معيّن ≈ 150,000 كم"],f:"أغلبها يُقطَع والنظر مثبّت على تلفاز صامت."},
{t:"كم حصاناً في إسطبلات قطر؟",u:"حصان",s:["سباق وقدرة وعرض وإسطبلات خاصة","نحو 30,000 حصان"],f:"من أكثر الحيوانات تدليلاً في البلد، وهي تعرف ذلك."},
{t:"كم كرة قدم تستهلكها أكاديميات ومدارس قطر في السنة؟",u:"كرة",s:["مئات الأكاديميات والمدارس","نحو 100,000 كرة تُفقَد أو تنفجر أو تبلى سنوياً"],f:"التي تنتهي على السطح لن تعود أبداً."},
{t:"كم مرة في اليوم يقول أحدهم في الدوحة «يلا»؟",u:"مرة",s:["تبدأ الجمل وتنهيها وتملأ الفراغات","نحو 40 مرة في اليوم"],f:"تحية ووداع ودعوة للانطلاق في آن."},
{t:"كم رشّة عود أو عطر يستخدمها الشخص قبل مناسبة كبيرة؟",u:"رشّة",s:["المعصمان والرقبة والثياب وواحدة للحظ","نحو 8 رشّات قبل ليلة كبيرة"],f:"العطر يميل إلى الوصول قبلك بقليل."},
{t:"كم مرة في اليوم يركن أحدهم ركناً مزدوجاً «لدقيقة» أمام محل في الدوحة؟",u:"مرة",s:["نحو 1.8 مليون سيارة","× نحو 1 من 6 يركن ركناً مزدوجاً سريعاً في يوم معيّن ≈ 300,000"],f:"الدقيقة الواحدة لم تكن يوماً دقيقة واحدة فعلاً."},
{t:"كم مرة في اليوم تُقال «ما شاء الله» على صورة رضيع في قطر؟",u:"مرة",s:["نحو 3 ملايين نسمة","× نحو 1 من 4 يقولها مرة واحدة على الأقل يومياً ≈ 750,000"],f:"تُقال إعجاباً، وبهدوء لإبعاد العين."},
{t:"كم سيارة تُترَك تعمل والمكيّف شغّال بينما صاحبها يدخل بسرعة؟",u:"سيارة",s:["نحو 1.8 مليون سيارة","× نحو 1 من 9 تُترَك شغّالة في وقت ما في يوم حار ≈ 200,000"],f:"العودة إلى سيارة باردة تستحق ذلك، على ما يبدو."},
{t:"كم مرة يحلّ حديث المجلس كل مشاكل العالم في ليلة واحدة؟",u:"مرة",s:["سياسة وكرة وأسعار بنزين وأيام زمان","نحو 5 حلول كبرى لكل جلسة"],f:"لا أحد منها يصمد أمام الصباح."},
{t:"كم قطة تُطعَم خارج مطاعم الدوحة في اليوم؟",u:"قطة",s:["نحو 8,000 مطعم ومقهى","× نحو 5 قطط دائمة عند الباب الخلفي ≈ 40,000 قطة مُشبَعة"],f:"لكل واحدة مكانها المفضّل وجدولها الصارم."},
{t:"كم مرة في اليوم يقول أحدهم «خمس دقائق» بانتظار طعام يحتاج ثلاثين؟",u:"مرة",s:["نحو 900,000 وجبة تُطلب خارجاً يومياً","× نحو «خمس دقائق» متفائلة واحدة لكل وجبة ≈ 900,000"],f:"الجوع يفعل أشياء غريبة بإحساس الإنسان بالوقت."},
{t:"كم مجلساً وديوانية يُعقَد في قطر ليلة الجمعة؟",u:"مجلس",s:["عائلة وأصدقاء وجيران","نحو 50,000 تجمّع ليلة الجمعة"],f:"قِدر الكرك ومجموعة الدردشة يعملان بالتوازي."},
{t:"كم علبة مناديل تتجوّل في سيارات قطر الآن؟",u:"علبة",s:["نحو 1.8 مليون سيارة","× نحو 1.1 علبة لكل واحدة، مع التي على الرفّ الخلفي ≈ 2 مليون"],f:"الغطاء المخملي جنس قائم بذاته."},
{t:"كم مرة في الأسبوع يختفي ريموت المكيّف في بيت بالدوحة؟",u:"مرة",s:["الكنب والوسائد والدرج الوحيد","نحو 5 مرّات اختفاء في الأسبوع لكل بيت"],f:"يظهر دائماً لحظة يشتري أحدهم ريموتاً عامّاً."},
{t:"كم سيلفي يُلتقط في مدرّج كتارا في عطلة نهاية أسبوع؟",u:"سيلفي",s:["نحو 15,000 زائر للمدرّج","× نحو صورتين لكل واحد ≈ 30,000"],f:"الأقواس تؤدّي جزءاً كبيراً من العمل."},
{t:"كم مرة في اليوم يتوه أحدهم داخل مول كبير في الدوحة؟",u:"مرة",s:["نحو 150,000 زائر مول يومياً","× نحو 1 من 10 يأخذ منعطفاً خاطئاً ≈ 15,000"],f:"التصميم الحلزوني صمّمه شخص يملك حسّ دعابة."},

function copyText(t,ta,cb){
  // Reveal the hidden link/text so it can be long-pressed to copy manually.
  function reveal(){if(ta){try{ta.classList.remove("sr");ta.classList.add("linkbox");ta.readOnly=false;ta.focus();ta.setSelectionRange(0,(t||"").length);}catch(e){}}cb(false);}
  // Modern Clipboard API first — this is the method that actually works inside a
  // tap on iOS 13.4+ Safari over https. (execCommand can falsely report success
  // on iOS, so we do NOT trust it first.)
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
      navigator.clipboard.writeText(t).then(function(){cb(true);},reveal);
      return;
    }
  }catch(e){}
  // Fallback for browsers without the Clipboard API (older, or insecure context).
  var ok=false,el;
  try{
    el=document.createElement("textarea");el.value=t;el.readOnly=false;
    el.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";

    ok=document.execCommand("copy");

  if(ok)cb(true);else reveal();
}

(function(){var B=window.RQ_BUILD;if(!B)return;var KEY="rq-build-seen",last=0;
  function check(){var now=Date.now();if(now-last<60000)return;last=now;
    fetch(location.pathname+"?_v="+now,{cache:"no-store",headers:{Range:"bytes=0-3000"}})
      .then(function(r){return r.text()}).then(function(h){var m=/RQ_BUILD="([^"]+)"/.exec(h);if(!m)return;
        if(m[1]!==B){if(sessionStorage.getItem(KEY)===m[1])return;try{sessionStorage.setItem(KEY,m[1])}catch(e){}location.reload()}})
      .catch(function(){})}
  setTimeout(check,4000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});

<script type="module">
/* ===== Roughly Groups backend (Firebase) — optional, gated on a real config =====
   Paste your firebaseConfig from the Firebase console below to switch Groups on.
   The apiKey is PUBLIC and safe to commit — access is controlled by backend/firestore.rules.
   Leave it blank and Groups stay off; the rest of the game is unaffected.
   Full setup steps: backend/FIREBASE-SETUP.md */
const firebaseConfig = {
  apiKey: "AIzaSyDOJ4CQe4VCw1pMzxzq6juJtdXTY9Q_2dE",
  authDomain: "roughly-16260.firebaseapp.com",
  projectId: "roughly-16260",
  storageBucket: "roughly-16260.firebasestorage.app",
  messagingSenderId: "1066078017871",
  appId: "1:1066078017871:web:61414c9e14eb0de47b0d3a"
};

const GID_RE=/^[0-9a-z]{7}$/;
function gClean(s){return String(s||"").replace(/[^\p{L}\p{N} _.'-]/gu,"").trim().slice(0,24);}
function gName(){try{return gClean((JSON.parse(localStorage.getItem("rq-name"))||{}).n)||"";}catch(e){return "";}}
function gGenId(){const a="0123456789abcdefghijklmnopqrstuvwxyz";let s="",x=new Uint8Array(7);try{crypto.getRandomValues(x);}catch(e){for(let i=0;i<7;i++)x[i]=Math.floor(Math.random()*256);}for(let i=0;i<7;i++)s+=a[x[i]%36];return s;}
function gWeek(day){const sun=day-new Date(day*864e5).getUTCDay();return [0,1,2,3,4,5,6].map(i=>sun+i);}
/* Local memory of joined groups + last uid, so a lost anonymous session (new uid) can quietly rejoin. */
const GKEY="rq-groups",UKEY="rq-guid";
function gList(){try{const a=JSON.parse(localStorage.getItem(GKEY));return Array.isArray(a)?a.filter(x=>GID_RE.test(x)):[];}catch(e){return [];}}
function gSaveList(a){try{localStorage.setItem(GKEY,JSON.stringify(a));}catch(e){}}
function gRemember(id){const a=gList();if(GID_RE.test(id)&&a.indexOf(id)<0){a.push(id);gSaveList(a);}}
function gForget(id){gSaveList(gList().filter(x=>x!==id));}
function gTodayAvg(){try{return window.RQ_todayAvg?window.RQ_todayAvg():0;}catch(e){return 0;}}
function gToday(){try{return window.RQ_today?window.RQ_today():Math.floor(Date.now()/864e5);}catch(e){return Math.floor(Date.now()/864e5);}}

if(!firebaseConfig||!firebaseConfig.apiKey){
  window.RQGroups={enabled:false};
}else{
  try{
    const V="10.12.5",B="https://www.gstatic.com/firebasejs/"+V+"/";
    const [A,AU,FS]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    const app=A.initializeApp(firebaseConfig),auth=AU.getAuth(app),db=FS.getFirestore(app);
    const {onAuthStateChanged,signInAnonymously,GoogleAuthProvider,linkWithPopup,signInWithPopup}=AU;
    const {doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,query,where,arrayUnion,arrayRemove,serverTimestamp}=FS;
    let resolveReady;const ready=new Promise(r=>resolveReady=r);
    onAuthStateChanged(auth,u=>{if(!u){signInAnonymously(auth).catch(()=>{});}else{resolveReady(u);}});
    const uid=()=>auth.currentUser&&auth.currentUser.uid;
    // Write today's score (if today's drop is finished) to one group straight away.
    async function writeToday(id,name){const a=gTodayAvg();if(!a)return;const me=uid(),d=gToday();
      try{await setDoc(doc(db,"groups",id,"scores",d+"__"+me),{uid:me,name:gClean(name)||gName()||"Player",day:d,avg:Math.max(1,Math.min(100,Math.round(a)))},{merge:true});}catch(e){}}
    // If the uid changed since last time, rejoin every remembered group this uid isn't in.
    async function restore(){const u=uid();if(!u)return;let last="";try{last=localStorage.getItem(UKEY)||"";}catch(e){}
      let ok=true;
      if(last&&last!==u){for(const id of gList()){try{const s=await getDoc(doc(db,"groups",id));if(!s.exists()){gForget(id);continue;}
        if((s.data().memberUids||[]).indexOf(u)<0){await updateDoc(doc(db,"groups",id),{memberUids:arrayUnion(u)});
          await setDoc(doc(db,"groups",id,"members",u),{name:gName()||"Player",joinedAt:serverTimestamp()});}}catch(e){ok=false;}}}
      if(ok){try{localStorage.setItem(UKEY,u);}catch(e){}}}
    async function myGroupDocs(){await ready;const qs=await getDocs(query(collection(db,"groups"),where("memberUids","array-contains",uid())));return qs.docs;}
    const APIg={
      enabled:true, ready,
      user(){const u=auth.currentUser;return u?{uid:u.uid,anon:u.isAnonymous,email:u.email||"",name:gName()}:null;},
      async createGroup(name){await ready;name=gClean(name);if(!name)throw new Error("Give the group a name");const id=gGenId(),u=uid();
        await setDoc(doc(db,"groups",id),{name,ownerUid:u,memberUids:[u],createdAt:serverTimestamp()});
        await setDoc(doc(db,"groups",id,"members",u),{name:gName()||"Player",joinedAt:serverTimestamp()});
        gRemember(id);await writeToday(id);
        return {id,name};},
      async groupMeta(id){await ready;if(!GID_RE.test(id))throw new Error("That code doesn’t look right");const s=await getDoc(doc(db,"groups",id));if(!s.exists())throw new Error("No group with that code");const d=s.data();return {id,name:d.name,isMember:(d.memberUids||[]).indexOf(uid())>=0,members:(d.memberUids||[]).length};},
      async joinGroup(id,name){await ready;const meta=await this.groupMeta(id),u=uid();
        if(!meta.isMember)await updateDoc(doc(db,"groups",id),{memberUids:arrayUnion(u)});
        await setDoc(doc(db,"groups",id,"members",u),{name:gClean(name)||gName()||"Player",joinedAt:serverTimestamp()});
        gRemember(id);await writeToday(id,name);
        return {id,name:meta.name};},
      async leaveGroup(id){await ready;const u=uid();await updateDoc(doc(db,"groups",id),{memberUids:arrayRemove(u)});gForget(id);try{await deleteDoc(doc(db,"groups",id,"members",u));}catch(e){}return true;},
      async listGroups(){const docs=await myGroupDocs(),wk=gWeek(gToday()),me=uid(),out=[];
        for(const g of docs){let my=0,rank=0;gRemember(g.id);
          try{const ss=await getDocs(query(collection(db,"groups",g.id,"scores"),where("day","in",wk)));const tot={};ss.forEach(x=>{const d=x.data();tot[d.uid]=(tot[d.uid]||0)+(d.avg||0);});my=tot[me]||0;rank=1;for(const k in tot)if(tot[k]>my)rank++;}catch(e){rank=0;}
          out.push({id:g.id,name:g.data().name,members:(g.data().memberUids||[]).length,myTotal:Math.round(my),myRank:rank});}
        return out;},
      async board(id){await ready;const wk=gWeek(gToday()),me=uid();
        const [g,ms,ss]=await Promise.all([
          getDoc(doc(db,"groups",id)),
          getDocs(collection(db,"groups",id,"members")).catch(()=>null),
          getDocs(query(collection(db,"groups",id,"scores"),where("day","in",wk))).catch(()=>null)
        ]);
        if(!g.exists())throw new Error("Group not found");
        const names={};if(ms)ms.forEach(x=>names[x.id]=(x.data().name||"Player"));
        const tot={};if(ss)ss.forEach(x=>{const d=x.data();tot[d.uid]=(tot[d.uid]||0)+(d.avg||0);if(d.name&&!names[d.uid])names[d.uid]=d.name;});
        const uids=g.data().memberUids||[];
        const rows=uids.map(u=>({uid:u,name:names[u]||"Player",total:Math.round(tot[u]||0),you:u===me})).sort((a,b)=>b.total-a.total);
        return {id,name:g.data().name,members:uids.length,rows};},
      async submitDay(day,avg){if(day!==gToday())return;try{await ready;avg=Math.max(1,Math.min(100,Math.round(avg)));const docs=await myGroupDocs(),me=uid(),nm=gName()||"Player";
        await Promise.all(docs.map(g=>setDoc(doc(db,"groups",g.id,"scores",day+"__"+me),{uid:me,name:nm,day,avg},{merge:true}).catch(()=>{})));}catch(e){}},
      async linkGoogle(){await ready;const prov=new GoogleAuthProvider();
        try{await linkWithPopup(auth.currentUser,prov);}
        catch(e){if(e&&e.code==="auth/credential-already-in-use")await signInWithPopup(auth,prov);else throw e;}
        await restore();const a=gTodayAvg();if(a)await APIg.submitDay(gToday(),a);
        const u=auth.currentUser;return {email:u.email||"",name:u.displayName||gName()};}
    };
    window.RQGroups=APIg;
    ready.then(async()=>{try{await restore();}catch(e){}
      if(window.RQ_onGroupsReady)window.RQ_onGroupsReady();
      const a=gTodayAvg();if(a)APIg.submitDay(gToday(),a);
      const m=/[?&]g=([0-9a-z]{7})/.exec(location.search||"");const id=(m&&m[1])||window.__rqG;if(id&&window.RQ_inviteFlow)window.RQ_inviteFlow(id);});
  }catch(e){window.RQGroups={enabled:false};}
}
</script>
